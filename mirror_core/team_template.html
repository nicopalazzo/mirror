<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team mirror</title><style>
:root{color-scheme:light;--bg:#f6f5f2;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#3f3e3b;--muted:#5f5e59;--line:#e3e1da;--grid:#e9e7e0;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--band:rgba(42,120,214,.10);--h0:#eaf1fb;--h1:#b7d0f2;--h2:#7fb0ea;--h3:#3f87dc;--h4:#1d5cad;--gap:#e4e2db;--spark:#8d8b83}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111110;--surface:#1a1a19;--ink:#fff;--ink2:#dcdbd2;--muted:#b3b2a8;--line:#33322e;--grid:#2a2926;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--band:rgba(57,135,229,.16);--h0:#1c2634;--h1:#24405f;--h2:#2f5f97;--h3:#3f87dc;--h4:#8fc0f5;--gap:#2a2926;--spark:#8d8b83}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111110;--surface:#1a1a19;--ink:#fff;--ink2:#dcdbd2;--muted:#b3b2a8;--line:#33322e;--grid:#2a2926;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--band:rgba(57,135,229,.16);--h0:#1c2634;--h1:#24405f;--h2:#2f5f97;--h3:#3f87dc;--h4:#8fc0f5;--gap:#2a2926;--spark:#8d8b83}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-wrap:anywhere}
main{max-width:760px;margin:auto;padding:24px 16px 48px}
h1{font-size:32px}h2{font-size:20px}p{color:var(--ink2)}
.card{margin:20px 0;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.value{font-size:36px;font-weight:700;color:var(--ink);margin-bottom:0}
.bar{height:24px;position:relative;background:var(--grid);margin:16px 0}
.band{position:absolute;top:0;bottom:0;background:var(--band);border:1px solid var(--s1)}
.tick{position:absolute;top:-4px;bottom:-4px;border-left:3px solid var(--ink)}
li{margin-bottom:12px}footer{margin-top:32px}
</style></head><body><main><h1>Team mirror</h1><p>{{SUBTITLE}}</p>
{{CARDS}}
<section><h2>What this cannot tell you</h2><ul>{{CANNOT}}</ul><p>{{DISCLAIMER}}</p></section>
<footer>Made on this computer from cards people chose to share. Mirror sent nothing.</footer>
</main></body></html>
